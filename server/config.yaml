# Notice Server 配置文件
# 优先级: 环境变量 > 配置文件 > 默认值
#
# 配置文件路径指定方式:
#   命令行: ./notice-server -c /path/to/config.yaml
#   环境变量: CONFIG_PATH=/path/to/config.yaml

# HTTP 服务配置
http:
  # HTTP 端口
  # 环境变量: HTTP_PORT
  port: "9090"

  # 请求体最大字节数（防 DoS），0 表示默认 512KB
  # 环境变量: HTTP_MAX_REQUEST_BODY_BYTES
  max_request_body_bytes: 0

# MQTT Broker 配置
mqtt:
  # TCP 端口（内网使用）
  # 环境变量: MQTT_TCP_PORT
  tcp_port: "9091"

  # WebSocket 端口（Web 客户端使用）
  # 环境变量: MQTT_WS_PORT
  ws_port: "9092"

  # 默认消息主题
  # 环境变量: MQTT_TOPIC
  topic: "notice"

  # 会话过期时间（秒）：断联超过此时长的客户端会话会被自动清除（内存与持久化存储）
  # 用于离线消息保留上限；设为 0 则不断开即清除（不保留离线会话）
  # 环境变量: MQTT_SESSION_EXPIRY
  session_expiry: 86400

  # 消息过期时间（秒）
  # 环境变量: MQTT_MESSAGE_EXPIRY
  message_expiry: 86400

# 认证配置
auth:
  # 访问令牌，留空则自动生成
  # 环境变量: AUTH_TOKEN
  token: ""

# 限流配置（同时作用于 Webhook 与 MQTT 认证失败）
rate_limit:
  # 每 IP 最大失败次数，超过则封禁该 IP
  # 环境变量: RATE_LIMIT_MAX_FAILURES
  max_failures: 10

  # 封禁时间（秒），默认 15 分钟
  # 环境变量: RATE_LIMIT_BLOCK_TIME
  block_time: 900

  # 统计窗口（秒），默认 5 分钟
  # 环境变量: RATE_LIMIT_WINDOW_TIME
  window_time: 300

  # ----- 防「换 IP 暴力破解」：以下为可选，设为 0 表示关闭 -----
  # 每分钟全局认证失败次数上限，超过则短时拒绝所有认证（任一 IP 均 429/连接拒）
  # 环境变量: RATE_LIMIT_GLOBAL_MAX_PER_MINUTE
  global_max_per_minute: 60

  # 全局触发封禁后的冷却时间（秒）
  # 环境变量: RATE_LIMIT_GLOBAL_BLOCK_TIME
  global_block_time: 300

  # 同一错误 token 被尝试的最大次数（多 IP 累计），超过则临时封禁该凭证
  # 环境变量: RATE_LIMIT_CREDENTIAL_MAX_FAILURES
  credential_max_failures: 0

# 日志配置
log:
  # 控制台日志级别: debug, info, warn, error, off
  # 环境变量: LOG_CONSOLE_LEVEL
  console_level: "info"

  # 文件日志级别: debug, info, warn, error, off
  # 环境变量: LOG_FILE_LEVEL
  file_level: "debug"

  # 日志文件路径，为空则不写入文件
  # 环境变量: LOG_FILE_PATH
  file_path: "logs/server.log"

  # 控制台是否美化输出
  # 环境变量: LOG_PRETTY
  pretty: true

  # 日志轮转天数，0 表示不轮转
  # 环境变量: LOG_ROTATE_DAYS
  rotate_days: 1

  # 保留日志文件数量，0 表示不限制
  # 环境变量: LOG_MAX_FILES
  max_files: 7

# 持久化存储配置
storage:
  # 是否启用持久化存储（会话、订阅、离线消息）
  # 启用后服务器重启不会丢失数据
  # 环境变量: STORAGE_ENABLED
  enabled: true

  # 数据存储路径
  # 环境变量: STORAGE_PATH
  path: "data"

# 消息配置
message:
  # 标题最大长度（字符），0 表示不限制
  # 环境变量: MESSAGE_MAX_TITLE_LENGTH
  max_title_length: 50

  # 内容最大长度（字符），0 表示不限制
  # 环境变量: MESSAGE_MAX_CONTENT_LENGTH
  max_content_length: 1024

# 图片上传与缓存配置
image:
  # 图片存储子目录名（相对 storage.path）
  # 环境变量: IMAGE_FOLDER
  folder: "images"

  # 签名 URL 有效期（秒），默认 24 小时
  # 环境变量: IMAGE_URL_EXPIRY_SECONDS
  url_expiry_seconds: 86400

  # 是否启用过期图片自动清理
  # 环境变量: IMAGE_CLEANUP_ENABLED
  cleanup_enabled: true

  # 清理任务执行间隔（秒），默认 1 小时
  # 环境变量: IMAGE_CLEANUP_INTERVAL_SECONDS
  cleanup_interval_seconds: 3600

  # 单张图片最大字节数，默认 5MB
  # 环境变量: IMAGE_MAX_UPLOAD_BYTES
  max_upload_bytes: 5242880

  # 单次请求（多图）总最大字节数，默认 20MB；0 表示与 max_upload_bytes 相同
  # 环境变量: IMAGE_MAX_UPLOAD_TOTAL_BYTES
  max_upload_total_bytes: 20971520

  # 允许的图片扩展名（小写带点），空则使用默认
  allowed_extensions:
    - ".jpg"
    - ".jpeg"
    - ".png"
    - ".gif"
    - ".webp"

# 多媒体上传与缓存配置（语音、视频等）
media:
  folder: "media"
  url_expiry_seconds: 86400
  cleanup_enabled: true
  cleanup_interval_seconds: 3600
  max_upload_bytes: 10485760  # 10MB
  allowed_extensions:
    - ".m4a"
    - ".mp3"
    - ".webm"
    - ".ogg"
    - ".wav"
